<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Vista previa de impresión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try {
    var theme = localStorage.getItem('redactorContratos.tema');
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  } catch (err) { /* se queda con el tema oscuro por defecto */ }
})();
</script>
<style>
  :root{
    --bg:#12151B;
    --surface:#1B1F28;
    --surface-raised:#20242E;
    --border:#2B303B;
    --border-strong:#3B424F;
    --text:#E7EAF0;
    --text-muted:#99A1B0;
    --text-faint:#6B7280;
    --accent:#5F8DFB;
    --accent-hover:#7DA1FC;
    --accent-contrast:#0B111F;
    --success:#33C77B;
    --danger:#FF6B6B;
    --focus:rgba(95,141,251,0.35);
    --scrollbar-track:#11151C;
    --scrollbar-thumb:#46526A;
    --scrollbar-thumb-hover:#5F8DFB;
    --scrollbar-border:#11151C;
  }

  html[data-theme="light"]{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --surface-raised:#FFFFFF;
    --border:#E3E6EB;
    --border-strong:#C9CEDA;
    --text:#1B2233;
    --text-muted:#667085;
    --text-faint:#8A93A6;
    --accent:#3163E8;
    --accent-hover:#274FC4;
    --accent-contrast:#FFFFFF;
    --success:#158452;
    --danger:#D6362C;
    --focus:rgba(49,99,232,0.28);
    --scrollbar-track:#EEF1F6;
    --scrollbar-thumb:#B7C0D0;
    --scrollbar-thumb-hover:#3163E8;
    --scrollbar-border:#EEF1F6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    transition:background-color .2s ease, color .2s ease;
  }
  html, body, *{
    scrollbar-width:thin;
    scrollbar-color:var(--scrollbar-thumb) var(--scrollbar-track);
  }
  *::-webkit-scrollbar{width:10px;height:10px;}
  *::-webkit-scrollbar-track{background:var(--scrollbar-track);}
  *::-webkit-scrollbar-thumb{
    background:var(--scrollbar-thumb);
    border:2px solid var(--scrollbar-border);
    border-radius:8px;
  }
  *::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover);}
  *::-webkit-scrollbar-corner{background:var(--scrollbar-track);}

  .modal-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:78px;
    padding:14px 22px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 12px rgba(27,34,51,0.06);
    flex-shrink:0;
  }
  .modal-topbar h1{
    font-size:1rem;
    font-weight:700;
    margin:0;
    color:var(--text);
  }
  .btn-close-x{
    background:var(--surface);
    border:1px solid var(--border-strong);
    color:var(--text);
    width:30px;
    height:30px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-close-x:hover{background:var(--surface-raised); color:var(--text); border-color:var(--accent);}

  .modal-body{
    flex:1;
    display:grid;
    grid-template-columns:1fr 300px;
    gap:0;
    min-height:0;
  }

  /* ---------- Panel del PDF: hoja limpia, sin marco decorativo ---------- */
  .pdf-pane{
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    min-height:0;
  }
  .pdf-frame-wrap{
    width:100%;
    height:100%;
    background:#fff;
    border:none;
    border-radius:0;
    box-shadow:none;
    margin:0;
    overflow:hidden;
  }
  .pdf-frame-wrap iframe{
    width:100%;
    height:100%;
    border:none;
  }

  .controls-pane{
    background:var(--surface);
    border-left:1px solid var(--border);
    padding:22px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .controls-pane h2{
    font-size:0.9rem;
    font-weight:700;
    margin:0;
    color:var(--text);
  }

  .fields-group{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .field label{
    display:block;
    font-size:0.74rem;
    font-weight:500;
    color:var(--text-muted);
    margin-bottom:6px;
  }

  .select-wrap{position:relative;}
  .select-wrap::after{
    content:"";
    position:absolute;
    right:12px;
    top:50%;
    width:8px;
    height:8px;
    border-right:1.5px solid var(--text-muted);
    border-bottom:1.5px solid var(--text-muted);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .field select, .field input[type="number"]{
    width:100%;
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:9px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.86rem;
    color:var(--text);
    background:var(--surface-raised);
    appearance:none;
    -webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field select{padding-right:32px; cursor:pointer;}
  .field select:focus, .field input[type="number"]:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--focus);
  }
  .field select:disabled{opacity:0.5; cursor:not-allowed;}

  /* ---------- Interruptores (checkboxes estilizados como toggle) ---------- */
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:2px 0;
  }
  .toggle-row .toggle-text{font-size:0.86rem; color:var(--text); font-weight:500;}
  .switch{
    position:relative;
    display:inline-block;
    width:38px;
    height:22px;
    flex-shrink:0;
  }
  .switch input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    margin:0;
    cursor:pointer;
    z-index:1;
  }
  .switch-track{
    position:absolute;
    inset:0;
    background:var(--border-strong);
    border-radius:999px;
    transition:background .15s ease;
  }
  .switch-thumb{
    position:absolute;
    top:2px;
    left:2px;
    width:18px;
    height:18px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 1px 2px rgba(0,0,0,0.3);
    transition:transform .15s ease;
  }
  .switch input:checked ~ .switch-track{background:var(--accent);}
  .switch input:checked ~ .switch-thumb{transform:translateX(16px);}
  .switch input:focus-visible ~ .switch-track{box-shadow:0 0 0 3px var(--focus);}

  .divider{
    height:1px;
    background:var(--border);
    border:none;
    margin:0;
  }

  .actions{
    margin-top:auto;
    padding-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.86rem;
    font-weight:600;
    border-radius:8px;
    border:1px solid transparent;
    padding:11px 14px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease;
  }
  button:active:not(:disabled){transform:scale(0.97);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  button:focus-visible{outline:none; box-shadow:0 0 0 3px var(--focus);}

  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover:not(:disabled){background:var(--accent-hover);}

  .btn-secondary{background:transparent; border-color:var(--border-strong); color:var(--text);}
  .btn-secondary:hover:not(:disabled){background:var(--surface-raised); border-color:var(--accent);}

  .btn-text{background:transparent; color:var(--text-muted); font-weight:500;}
  .btn-text:hover:not(:disabled){color:var(--text); background:var(--surface-raised);}

  .preview-status{
    font-size:0.8rem;
    line-height:1.4;
    min-height:18px;
    color:var(--text-muted);
  }
  .preview-status.is-error{color:var(--danger);}
  .preview-status.is-success{color:var(--success);}
</style>
</head>
<body>

<div class="modal-topbar">
  <h1>Vista previa de impresión</h1>
  <button class="btn-close-x" id="btnClose" title="Cerrar">×</button>
</div>

<div class="modal-body">
  <div class="pdf-pane">
    <div class="pdf-frame-wrap" id="pdfFrameWrap">
      <iframe id="pdfFrame" title="Vista previa del contrato"></iframe>
    </div>
  </div>

  <div class="controls-pane">
    <div class="fields-group">
      <h2>Opciones de impresión</h2>

      <div class="field">
        <label for="printerSelect">Impresora</label>
        <div class="select-wrap">
          <select id="printerSelect"></select>
        </div>
      </div>

      <div class="field">
        <label for="copiesInput">Copias</label>
        <input type="number" id="copiesInput" min="1" value="1">
      </div>

      <div class="field">
        <label for="paperSelect">Tipo de papel</label>
        <div class="select-wrap">
          <select id="paperSelect">
            <option value="A4" selected>A4</option>
            <option value="Letter">Carta (Letter)</option>
            <option value="Legal">Oficio (Legal)</option>
            <option value="A3">A3</option>
            <option value="A5">A5</option>
            <option value="Tabloid">Tabloid</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="marginsSelect">Márgenes</label>
        <div class="select-wrap">
          <select id="marginsSelect">
            <option value="default">Predeterminados</option>
            <option value="none">Sin márgenes</option>
            <option value="printableArea">Área imprimible mínima</option>
          </select>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="fields-group">
      <label class="toggle-row" for="colorCheckbox">
        <span class="toggle-text">Color</span>
        <span class="switch">
          <input type="checkbox" id="colorCheckbox" checked>
          <span class="switch-track"></span>
          <span class="switch-thumb"></span>
        </span>
      </label>
      <label class="toggle-row" for="landscapeCheckbox">
        <span class="toggle-text">Horizontal</span>
        <span class="switch">
          <input type="checkbox" id="landscapeCheckbox">
          <span class="switch-track"></span>
          <span class="switch-thumb"></span>
        </span>
      </label>
      <label class="toggle-row" for="bgCheckbox">
        <span class="toggle-text">Incluir fondo/color de fondo</span>
        <span class="switch">
          <input type="checkbox" id="bgCheckbox">
          <span class="switch-track"></span>
          <span class="switch-thumb"></span>
        </span>
      </label>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btnPrint">Imprimir</button>
      <button class="btn-secondary" id="btnSave">Guardar como PDF</button>
      <button class="btn-text" id="btnCancel">Cerrar</button>
      <div class="preview-status" id="previewStatus"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const htmlRoot = document.documentElement;
  const printerSelect = document.getElementById('printerSelect');
  const copiesInput = document.getElementById('copiesInput');
  const paperSelect = document.getElementById('paperSelect');
  const marginsSelect = document.getElementById('marginsSelect');
  const colorCheckbox = document.getElementById('colorCheckbox');
  const landscapeCheckbox = document.getElementById('landscapeCheckbox');
  const bgCheckbox = document.getElementById('bgCheckbox');
  const pdfFrame = document.getElementById('pdfFrame');
  const btnPrint = document.getElementById('btnPrint');
  const btnSave = document.getElementById('btnSave');
  const btnCancel = document.getElementById('btnCancel');
  const btnClose = document.getElementById('btnClose');
  const statusEl = document.getElementById('previewStatus');

  function applyTheme(theme){
    htmlRoot.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  }

  window.addEventListener('storage', (event) => {
    if (event.key === 'redactorContratos.tema') applyTheme(event.newValue);
  });

  function setStatus(message, kind){
    statusEl.textContent = message || '';
    statusEl.className = 'preview-status' + (kind ? ' is-' + kind : '');
  }

  async function init(){
    // Tema: se aplica lo antes posible (la ventana sigue oculta hasta
    // 'ready-to-show', así que no hay parpadeo visible) y se mantiene
    // sincronizado si el usuario cambia el tema en el editor mientras
    // este modal está abierto.
    try {
      if (window.previewAPI.getTheme) {
        const theme = await window.previewAPI.getTheme();
        applyTheme(theme);
      }
    } catch (err) { /* se queda con el tema por defecto */ }
    if (window.previewAPI.onThemeUpdated) {
      window.previewAPI.onThemeUpdated((theme) => applyTheme(theme));
    }

    // Sincroniza el tamaño de papel y la orientación con lo que ya se
    // eligió en el editor principal (antes este modal siempre reiniciaba
    // en A4 vertical, sin importar lo que se hubiera seleccionado allí).
    // El PDF que se muestra abajo ya fue generado con esas opciones, así
    // que solo hace falta reflejarlas en los controles, sin regenerarlo.
    try {
      if (window.previewAPI.getPrintOptions) {
        const opts = await window.previewAPI.getPrintOptions();
        if (opts) {
          if (opts.pageSize && paperSelect.querySelector(`option[value="${opts.pageSize}"]`)) {
            paperSelect.value = opts.pageSize;
          }
          landscapeCheckbox.checked = !!opts.landscape;
        }
      }
    } catch (err) { /* se queda con los valores por defecto (A4, vertical) */ }

    try {
      const url = await window.previewAPI.getPdfUrl();
      if (url) {
        pdfFrame.src = url;
      } else {
        setStatus('No se pudo generar la vista previa del documento.', 'error');
      }
    } catch (err) {
      setStatus('Error cargando la vista previa.', 'error');
    }

    try {
      const printers = await window.previewAPI.getPrinters();
      printerSelect.innerHTML = '';
      if (!printers || printers.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'No se detectaron impresoras';
        opt.disabled = true;
        opt.selected = true;
        printerSelect.appendChild(opt);
        btnPrint.disabled = true;
      } else {
        printers.forEach((p) => {
          const opt = document.createElement('option');
          opt.value = p.name;
          opt.textContent = p.displayName || p.name;
          if (p.isDefault) opt.selected = true;
          printerSelect.appendChild(opt);
        });
      }
    } catch (err) {
      setStatus('No se pudieron obtener las impresoras disponibles.', 'error');
    }
  }

  // Regenera el PDF de vista previa cuando cambia el papel o la
  // orientación, para que se vea igual a lo que se va a imprimir.
  async function refreshPreview(){
    setStatus('Actualizando vista previa...');
    try {
      const url = await window.previewAPI.updatePreview({
        pageSize: paperSelect.value,
        landscape: landscapeCheckbox.checked
      });
      if (url) {
        pdfFrame.src = url;
        setStatus('');
      } else {
        setStatus('No se pudo actualizar la vista previa.', 'error');
      }
    } catch (err) {
      setStatus('Error actualizando la vista previa.', 'error');
    }
  }
  paperSelect.addEventListener('change', refreshPreview);
  landscapeCheckbox.addEventListener('change', refreshPreview);

  btnPrint.addEventListener('click', async () => {
    btnPrint.disabled = true;
    setStatus('Enviando a la impresora...');
    try {
      const result = await window.previewAPI.executePrint({
        deviceName: printerSelect.value,
        copies: copiesInput.value,
        color: colorCheckbox.checked,
        landscape: landscapeCheckbox.checked,
        printBackground: bgCheckbox.checked,
        pageSize: paperSelect.value,
        marginsType: marginsSelect.value
      });
      if (result && result.success) {
        setStatus('Documento enviado a la impresora correctamente. Cerrando...', 'success');
        // Cierra la vista previa automáticamente tras imprimir con éxito.
        setTimeout(closeModal, 900);
      } else {
        setStatus('No se pudo imprimir' + (result && result.errorType ? (': ' + result.errorType) : '.'), 'error');
        btnPrint.disabled = false;
      }
    } catch (err) {
      setStatus('Ocurrió un error al imprimir.', 'error');
      btnPrint.disabled = false;
    }
  });

  btnSave.addEventListener('click', async () => {
    btnSave.disabled = true;
    setStatus('Guardando PDF...');
    try {
      const result = await window.previewAPI.savePdf();
      if (result && result.success) {
        setStatus('PDF guardado en: ' + result.filePath, 'success');
      } else if (result && result.canceled) {
        setStatus('');
      } else {
        setStatus('No se pudo guardar el PDF.', 'error');
      }
    } catch (err) {
      setStatus('Ocurrió un error al guardar el PDF.', 'error');
    } finally {
      btnSave.disabled = false;
    }
  });

  function closeModal(){
    if (window.previewAPI && window.previewAPI.close) window.previewAPI.close();
  }
  btnCancel.addEventListener('click', closeModal);
  btnClose.addEventListener('click', closeModal);

  init();
})();
</script>

</body>
</html>
